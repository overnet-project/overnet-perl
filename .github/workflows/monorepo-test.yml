name: monorepo layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    name: Repository layout
    steps:
      - uses: actions/checkout@v4

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Verify monorepo invariants
        run: prove -v t/monorepo-layout.t
