name: relay tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relay-test.yml'
      - 'relay-perl/**'
      - 'core-perl/**'
      - 'adapter-irc-perl/**'
      - 'overnet-perl-style/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-test.yml'
      - 'relay-perl/**'
      - 'core-perl/**'
      - 'adapter-irc-perl/**'
      - 'overnet-perl-style/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl: ['5.40', 'latest']
    name: Perl ${{ matrix.perl }}
    env:
      PERL5LIB: /home/runner/perl5/lib/perl5:${{ github.workspace }}/core-perl/lib:${{ github.workspace }}/irc-server/lib
      PERL_LOCAL_LIB_ROOT: /home/runner/perl5
      PERL_MB_OPT: --install_base /home/runner/perl5
      PERL_MM_OPT: INSTALL_BASE=/home/runner/perl5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: overnet-project/irc-server
          path: irc-server

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: overnet-project/spec
          path: spec

      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        id: setup-perl
        with:
          perl-version: ${{ matrix.perl }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/perl5
          key: perl-${{ steps.setup-perl.outputs.perl-version }}-${{ hashFiles('relay-perl/Makefile.PL', '.github/workflows/relay-test.yml') }}

      - name: Install dependencies
        run: |
          cpanm --local-lib ~/perl5 --installdeps ./core-perl
          cpanm --local-lib ~/perl5 --installdeps ./relay-perl
          cpanm --local-lib ~/perl5 --notest --reinstall Net::Nostr::Core Net::Nostr::Client Net::Nostr::Relay
          cpanm --local-lib ~/perl5 --notest ./overnet-perl-style

      - name: Run tests
        working-directory: relay-perl
        run: |
          prove -r -l -v t/
          prove -r -l -v xt/author/

  devel-cover:
    runs-on: ubuntu-latest
    name: Devel::Cover gate
    timeout-minutes: 90
    env:
      PERL5LIB: /home/runner/perl5/lib/perl5:${{ github.workspace }}/core-perl/lib:${{ github.workspace }}/irc-server/lib
      PERL_LOCAL_LIB_ROOT: /home/runner/perl5
      PERL_MB_OPT: --install_base /home/runner/perl5
      PERL_MM_OPT: INSTALL_BASE=/home/runner/perl5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: overnet-project/irc-server
          path: irc-server

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: overnet-project/spec
          path: spec

      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.40'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/perl5
          key: perl-devel-cover-5.40-${{ hashFiles('relay-perl/Makefile.PL', '.github/workflows/relay-test.yml') }}

      - name: Install dependencies
        run: |
          cpanm --local-lib ~/perl5 --installdeps ./core-perl
          cpanm --local-lib ~/perl5 --installdeps ./relay-perl
          cpanm --local-lib ~/perl5 --notest --reinstall Net::Nostr::Core Net::Nostr::Client Net::Nostr::Relay
          cpanm --local-lib ~/perl5 --notest ./overnet-perl-style
          cpanm --local-lib ~/perl5 --notest Devel::Cover
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"

      - name: Enforce per-file coverage floors
        working-directory: relay-perl
        env:
          OVERNET_COVERAGE: '1'
        run: prove -l -v xt/author/devel-cover.t
