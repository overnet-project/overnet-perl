name: Perl style tests

on:
  push:
    branches: [main]
    paths:
      - 'overnet-perl-style/**'
      - '.github/workflows/style-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'overnet-perl-style/**'
      - '.github/workflows/style-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl: ['5.40', 'latest']
    name: Perl ${{ matrix.perl }}
    env:
      PERL5LIB: /home/runner/perl5/lib/perl5
      PERL_LOCAL_LIB_ROOT: /home/runner/perl5
      PERL_MB_OPT: --install_base /home/runner/perl5
      PERL_MM_OPT: INSTALL_BASE=/home/runner/perl5
    defaults:
      run:
        working-directory: overnet-perl-style

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        id: setup-perl
        with:
          perl-version: ${{ matrix.perl }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/perl5
          key: perl-${{ steps.setup-perl.outputs.perl-version }}-${{ hashFiles('overnet-perl-style/Makefile.PL', '.github/workflows/style-test.yml') }}

      - name: Install dependencies
        run: |
          cpanm --local-lib ~/perl5 --installdeps .
          # Devel::Mutator is not a dist dependency; it is installed here only so
          # t/author-mutation-template.t can functionally exercise the mutation
          # template instead of skipping its behavioural checks.
          cpanm --local-lib ~/perl5 --notest Devel::Mutator

      - name: Run tests
        run: |
          prove -r -l -v t/

      - name: Run author tests
        run: |
          prove -r -l -v xt/author/

  devel-cover:
    runs-on: ubuntu-latest
    name: Devel::Cover gate
    timeout-minutes: 90
    env:
      PERL5LIB: /home/runner/perl5/lib/perl5
      PERL_LOCAL_LIB_ROOT: /home/runner/perl5
      PERL_MB_OPT: --install_base /home/runner/perl5
      PERL_MM_OPT: INSTALL_BASE=/home/runner/perl5
    defaults:
      run:
        working-directory: overnet-perl-style

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.40'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/perl5
          key: perl-devel-cover-5.40-${{ hashFiles('overnet-perl-style/Makefile.PL', '.github/workflows/style-test.yml') }}

      - name: Install dependencies
        run: |
          cpanm --local-lib ~/perl5 --installdeps .
          cpanm --local-lib ~/perl5 --notest Devel::Cover
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"

      - name: Enforce per-file coverage floors
        env:
          OVERNET_COVERAGE: '1'
        run: prove -l -v xt/author/devel-cover.t
