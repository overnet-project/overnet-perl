name: relay container

on:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/relay-container.yml'
      - '.github/dependabot.yml'
      - 'core-perl/**'
      - 'relay-perl/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-container.yml'
      - '.github/dependabot.yml'
      - 'core-perl/**'
      - 'relay-perl/**'

permissions:
  contents: read

jobs:
  build-and-smoke:
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Build and smoke-test the relay image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure the Podman Quadlet generator is installed
        run: |
          if ! test -x /usr/libexec/podman/quadlet \
            && ! test -x /usr/lib/systemd/system-generators/podman-system-generator \
            && ! test -x /usr/lib/systemd/user-generators/podman-user-generator; then
            sudo apt-get update
            sudo apt-get install --yes --reinstall podman
          fi

      - name: Podman version
        run: podman version

      - name: Build the relay image
        run: |
          podman build \
            --file relay-perl/deploy/podman/Containerfile \
            --tag overnet-relay:ci \
            "$GITHUB_WORKSPACE"

      - name: Smoke-test the generic relay
        run: relay-perl/deploy/podman/smoke-test.sh overnet-relay:ci

      - name: Smoke-test the authority relay
        run: |
          relay-perl/deploy/podman/smoke-test.sh \
            overnet-relay:ci \
            relay-perl/deploy/podman/overnet-authority-relay.container

      - name: Validate the Quadlet units
        run: relay-perl/deploy/podman/quadlet-check.sh

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment: quay-publish
    concurrency:
      group: relay-container-publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Test and publish the relay image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure the Podman Quadlet generator is installed
        run: |
          if ! test -x /usr/libexec/podman/quadlet \
            && ! test -x /usr/lib/systemd/system-generators/podman-system-generator \
            && ! test -x /usr/lib/systemd/user-generators/podman-user-generator; then
            sudo apt-get update
            sudo apt-get install --yes --reinstall podman
          fi

      - name: Podman version
        run: podman version

      - name: Resolve the write-once commit image
        id: commit-image
        run: |
          repository="quay.io/overnet/relay"
          tag="sha-${GITHUB_SHA}"
          existing_digest="$(
            relay-perl/deploy/podman/registry-tag-digest.sh \
              "$repository" "$tag"
          )"

          if test -n "$existing_digest"; then
            podman pull "$repository@$existing_digest"
            podman tag "$repository@$existing_digest" overnet-relay:ci

            revision="$(
              podman image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                overnet-relay:ci
            )"
            version="$(
              podman image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
                overnet-relay:ci
            )"
            test "$revision" = "$GITHUB_SHA"
            test "$version" = "sha-${GITHUB_SHA}"

            printf 'exists=true\ndigest=%s\n' "$existing_digest" \
              >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\ndigest=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build the relay image
        if: steps.commit-image.outputs.exists != 'true'
        run: |
          build_date="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          podman build \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg VERSION="sha-${GITHUB_SHA}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --file relay-perl/deploy/podman/Containerfile \
            --tag overnet-relay:ci \
            "$GITHUB_WORKSPACE"

      - name: Smoke-test the generic relay
        run: relay-perl/deploy/podman/smoke-test.sh overnet-relay:ci

      - name: Smoke-test the authority relay
        run: |
          relay-perl/deploy/podman/smoke-test.sh \
            overnet-relay:ci \
            relay-perl/deploy/podman/overnet-authority-relay.container

      - name: Validate the Quadlet units
        run: relay-perl/deploy/podman/quadlet-check.sh

      - name: Log in to Quay
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_USERNAME: ${{ vars.QUAY_USERNAME }}
        run: |
          test -n "$QUAY_USERNAME"
          test -n "$QUAY_TOKEN"
          printf '%s' "$QUAY_TOKEN" | podman login quay.io \
            --username "$QUAY_USERNAME" \
            --password-stdin

      - name: Publish the tested image
        env:
          EXISTING_DIGEST: ${{ steps.commit-image.outputs.digest }}
        run: |
          relay-perl/deploy/podman/publish-image.sh \
            overnet-relay:ci \
            quay.io/overnet/relay \
            "$GITHUB_SHA" \
            "$EXISTING_DIGEST" \
            "$GITHUB_STEP_SUMMARY"

      - name: Log out of Quay
        if: ${{ always() }}
        run: podman logout quay.io || true
